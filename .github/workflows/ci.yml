# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `rust-toolchain.toml` at the repo root is the single source of truth for
      # the compiler: it selects 1.98.1 with rustfmt and clippy, and any cargo or
      # rustc invocation through the rustup shims installs and uses it. A
      # reproducibility-focused tool must not have CI and a local checkout drift
      # apart, so CI does not pass a version of its own.
      - name: Show the toolchain selected by rust-toolchain.toml
        run: |
          rustup show
          rustc --version
          cargo --version

      # `rustc --version` above already triggered the install. Fail loudly if what
      # ran is not the pin, rather than discovering it from a confusing build error.
      - name: Verify the pinned compiler is the one running
        run: |
          case "$(rustc --version)" in
            "rustc 1.98.1 "*) echo "pinned toolchain active" ;;
            *)
              echo "::error::expected rustc 1.98.1, got $(rustc --version)"
              exit 1
              ;;
          esac

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The binary passing its own tests is not the same claim as the crate being
      # publishable: packaging resolves the manifest, honours `include`/`exclude` and
      # builds the package in isolation. It is quick, and it fails here rather than on
      # the day someone tries to release.
      - name: Package
        run: cargo package --locked
