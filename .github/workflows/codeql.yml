name: CodeQL

# Static analysis over the source, and over the automation around it. Rust is an
# officially supported CodeQL language (generally available since October 2025) and
# needs no build — `build-mode: none` is the documented mode for it, which is why this
# job does not compile the crate a second time.
#
# `actions` covers `action.yml` and `.github/workflows/`, which is a real part of this
# repository's surface: the composite action and the release workflow are things people
# run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The queries improve without this repository changing.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The scan needs to write its findings to the code-scanning API; nothing else here
    # needs more than reading the repository.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
