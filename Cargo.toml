# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "agentchecksum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Language-agnostic dependency fingerprint and behavioral regression gate for AI agents"
repository = "https://github.com/f0rknturkoglu/agentchecksum"

[dependencies]
# CLI parsing; hand-rolling argument handling is unjustifiable.
clap = { version = "4.6", features = ["derive"] }
# Data model and lockfile.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# RFC 8785 JCS: a specification instead of a hand-rolled canonicalizer.
serde_json_canonicalizer = "0.3"
# SHA-256, matching Ollama's model-digest alphabet.
sha2 = "0.11"
# Structured errors with typed fields, for the diagnostic format in spec §14.
thiserror = "2.0"
# Config and probes: one configuration language.
toml = "1.1"
# Diagnostics on stderr, keeping stdout machine-clean.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Ollama metadata discovery (spec §7.6). Default features already select rustls.
reqwest = { version = "0.13", features = ["json"] }
# Required by reqwest; the MCP client joins in a later phase.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# JSON Schema validation for probe expectations and tool arguments (spec §10.2).
# `default-features = false` is load-bearing: the defaults enable `resolve-http` and
# `resolve-file`, and a validator that can fetch a URL would turn a probe into
# network access. Internal `#/…` references only.
jsonschema = { version = "0.56", default-features = false }
# The official MCP SDK (spec §9). Client only: `default-features = false` drops the
# server, its macros, and the schema generator, none of which the binary uses.
# `reqwest` selects the rustls backend — without a TLS feature the Streamable HTTP
# transport compiles but cannot reach an https:// origin at all.
rmcp = { version = "3.4", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

[dev-dependencies]
assert_cmd = "2.2"
insta = { version = "1.48", features = ["json"] }
tempfile = "3.27"
wiremock = "0.6"
# Listed explicitly so integration tests do not rely on an implicit edge.
serde_json = "1.0"
# The same SDK's server side, for local MCP fixtures. Dev-only features unify into
# test targets, so the shipped binary stays client-only.
rmcp = { version = "3.4", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
